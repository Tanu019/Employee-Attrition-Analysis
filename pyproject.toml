[project]
name = "attrition-lens"
version = "1.0.0"
description = "Workforce Intelligence & Predictive Retention Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pandas>=2.2.0",
